<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sentiment Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container py-5">
        <header>
            <h1>Sentiment<span class="highlight">AI</span></h1>
            <p>Analyze text emotion instantly with advanced VADER processing</p>
        </header>

        <main class="glass-panel">
            <div class="input-section">
                <textarea id="text-input" class="form-control mb-3" placeholder="Type or paste your text here..." rows="6"></textarea>
                
                <div class="file-upload-container mb-3 p-3 border border-dashed rounded text-center" style="border-style: dashed !important; background: rgba(255,255,255,0.02);">
                    <p class="text-secondary mb-2 small">Or analyze a file (CSV or TXT)</p>
                    <input type="file" id="file-input" class="form-control form-control-sm bg-transparent text-secondary" accept=".csv,.txt">
                </div>

                <div class="controls d-flex justify-content-end gap-2">
                    <button id="analyze-btn" class="primary-btn">
                        <span>Analyze Sentiment</span>
                        <i class="fas fa-magic"></i>
                    </button>
                    <button id="clear-btn" class="icon-btn" title="Clear Text">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <div id="results" class="results-section hidden mt-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="sentiment-badge m-0" id="sentiment-badge">
                        <i id="sentiment-icon" class="fas fa-minus"></i>
                        <span id="sentiment-text">Neutral</span>
                    </div>
                    <span id="file-info" class="text-secondary small"></span>
                </div>
                
                <div class="bootstrap-scores">
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-secondary">Positive</span>
                            <span id="pos-val" class="fw-bold text-success">0%</span>
                        </div>
                        <div class="progress" style="height: 10px; background-color: rgba(255,255,255,0.1);">
                            <div id="pos-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-secondary">Neutral</span>
                            <span id="neu-val" class="fw-bold text-info">0%</span>
                        </div>
                        <div class="progress" style="height: 10px; background-color: rgba(255,255,255,0.1);">
                            <div id="neu-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-secondary">Negative</span>
                            <span id="neg-val" class="fw-bold text-danger">0%</span>
                        </div>
                        <div class="progress" style="height: 10px; background-color: rgba(255,255,255,0.1);">
                            <div id="neg-bar" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                
                <div id="reviews-container" class="mt-5 hidden">
                    <h5 class="text-secondary mb-3 border-bottom pb-2 border-secondary">Individual Reviews</h5>
                    <div id="reviews-list" class="d-flex flex-column gap-3"></div>
                </div>
            </div>
            
            <div id="loading" class="loading-overlay hidden">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-white">Analyzing...</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const analyzeBtn = document.getElementById('analyze-btn');
            const clearBtn = document.getElementById('clear-btn');
            const textInput = document.getElementById('text-input');
            const resultsSection = document.getElementById('results');
            const loadingOverlay = document.getElementById('loading');
            
            const sentimentBadge = document.getElementById('sentiment-badge');
            const sentimentIcon = document.getElementById('sentiment-icon');
            const sentimentText = document.getElementById('sentiment-text');
            
            const posBar = document.getElementById('pos-bar');
            const neuBar = document.getElementById('neu-bar');
            const negBar = document.getElementById('neg-bar');
            
            const posVal = document.getElementById('pos-val');
            const neuVal = document.getElementById('neu-val');
            const negVal = document.getElementById('neg-val');

            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const reviewsContainer = document.getElementById('reviews-container');
            const reviewsList = document.getElementById('reviews-list');

            clearBtn.addEventListener('click', () => {
                textInput.value = '';
                fileInput.value = '';
                resultsSection.classList.add('hidden');
                reviewsContainer.classList.add('hidden');
                reviewsList.innerHTML = '';
            });

            analyzeBtn.addEventListener('click', async () => {
                const text = textInput.value.trim();
                const file = fileInput.files[0];

                if (!text && !file) {
                    textInput.classList.add('error-shake');
                    setTimeout(() => textInput.classList.remove('error-shake'), 500);
                    return;
                }

                // Show loading
                resultsSection.classList.add('hidden');
                loadingOverlay.classList.remove('hidden');

                try {
                    let response;
                    if (file) {
                        const formData = new FormData();
                        formData.append('file', file);
                        response = await fetch('/analyze-file', {
                            method: 'POST',
                            body: formData
                        });
                    } else {
                        response = await fetch('/analyze', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ text })
                        });
                    }

                    const data = await response.json();
                    
                    if (response.ok) {
                        updateResults(data);
                    } else {
                        alert(data.error || 'An error occurred');
                    }
                } catch (error) {
                    alert('Network error occurred');
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            });

            function updateResults(data) {
                const { sentiment, scores, count, reviews } = data;
                
                if (count) {
                    fileInfo.textContent = `Analyzed ${count} entries`;
                } else {
                    fileInfo.textContent = '';
                }

                // Reset classes
                sentimentBadge.className = 'sentiment-badge ' + sentiment;
                
                // Update icon and text
                if (sentiment === 'positive') {
                    sentimentIcon.className = 'fas fa-smile-beam';
                    sentimentText.textContent = 'Overall Positive';
                } else if (sentiment === 'negative') {
                    sentimentIcon.className = 'fas fa-frown';
                    sentimentText.textContent = 'Overall Negative';
                } else {
                    sentimentIcon.className = 'fas fa-meh';
                    sentimentText.textContent = 'Overall Neutral';
                }
                
                // Update bars
                setTimeout(() => {
                    posBar.style.width = (scores.pos * 100) + '%';
                    neuBar.style.width = (scores.neu * 100) + '%';
                    negBar.style.width = (scores.neg * 100) + '%';
                    
                    posVal.textContent = Math.round(scores.pos * 100) + '%';
                    neuVal.textContent = Math.round(scores.neu * 100) + '%';
                    negVal.textContent = Math.round(scores.neg * 100) + '%';
                }, 50);

                // Render individual reviews if available
                if (reviews && reviews.length > 0) {
                    reviewsList.innerHTML = '';
                    reviews.forEach((r, idx) => {
                        let colorClass = r.sentiment === 'positive' ? 'text-success' : (r.sentiment === 'negative' ? 'text-danger' : 'text-info');
                        let iconClass = r.sentiment === 'positive' ? 'fa-smile-beam' : (r.sentiment === 'negative' ? 'fa-frown' : 'fa-meh');
                        
                        reviewsList.innerHTML += `
                            <div class="p-3 border border-secondary rounded" style="background: rgba(255,255,255,0.02);">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="small text-secondary">#${idx + 1}</span>
                                    <span class="${colorClass} small fw-bold"><i class="fas ${iconClass} me-1"></i>${r.sentiment.charAt(0).toUpperCase() + r.sentiment.slice(1)}</span>
                                </div>
                                <p class="mb-2 text-white" style="font-size: 0.95rem;">${r.text}</p>
                                <div class="d-flex gap-3 small">
                                    <span class="text-success"><i class="fas fa-arrow-up me-1"></i>${Math.round(r.scores.pos * 100)}%</span>
                                    <span class="text-info"><i class="fas fa-minus me-1"></i>${Math.round(r.scores.neu * 100)}%</span>
                                    <span class="text-danger"><i class="fas fa-arrow-down me-1"></i>${Math.round(r.scores.neg * 100)}%</span>
                                </div>
                            </div>
                        `;
                    });
                    reviewsContainer.classList.remove('hidden');
                } else {
                    reviewsContainer.classList.add('hidden');
                }

                resultsSection.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
